name: Run Agent

on:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest

    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Agent
        run: python agent.py
