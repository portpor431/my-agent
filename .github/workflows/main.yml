name: SSH Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test network
        run: |
          set -x
          curl -I --max-time 10 https://tmate.io
          getent hosts ssh.tmate.io
          timeout 10 bash -c '</dev/tcp/ssh.tmate.io/22' && echo "PORT 22 OK" || echo "PORT 22 FAILED"

      - name: Start tmate
        uses: mxschmitt/action-tmate@v3.24
        timeout-minutes: 10
